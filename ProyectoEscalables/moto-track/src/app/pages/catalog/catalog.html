<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  
  <!-- Banner de Búsqueda -->
  <div class="bg-blue-800 rounded-xl p-8 text-white shadow-lg mb-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' viewBox=\'0 0 20 20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'%231c2541\' fill-opacity=\'0.4\' fill-rule=\'evenodd\'%3E%3Ccircle cx=\'3\' cy=\'3\' r=\'3\'/%3E%3Ccircle cx=\'13\' cy=\'13\' r=\'3\'/%3E%3C/g%3E%3C/svg%3E');">
    <h1 class="text-3xl font-bold mb-2">Encuentra las refacciones para tu moto</h1>
    <p class="text-blue-200 mb-6">Explora nuestro catálogo y mantén tu vehículo en óptimas condiciones.</p>
    
    <div class="flex gap-2 max-w-xl">
      <select class="px-4 py-3 rounded text-gray-700 bg-white w-1/3 outline-none">
        <option>Todas las Categorías</option>
        <option>Frenos</option>
        <option>Motor</option>
        <option>Transmisión</option>
      </select>
      <button class="bg-brand-dark hover:bg-gray-900 text-white px-6 py-3 rounded font-semibold flex-1 text-left flex justify-between items-center transition">
        <span>Buscar</span>
        <span class="text-gray-400">🔍</span>
      </button>
    </div>
  </div>

  <!-- Cuadrícula de Refacciones -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    
    <div *ngFor="let part of spareParts" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
      
      <!-- Espacio para la imagen -->
      <div class="h-48 bg-gray-100 flex items-center justify-center p-4">
        <!-- Reemplaza el src con {{ part.image }} cuando tengas los assets -->
        <div class="text-5xl text-gray-400">⚙️</div>
      </div>
      
      <div class="p-5">
        <p class="text-xs font-bold text-blue-600 tracking-wider mb-1">{{ part.category }}</p>
        <h3 class="text-lg font-bold text-gray-800 mb-1">{{ part.name }}</h3>
        <p class="text-sm text-gray-500 mb-4">{{ part.compatibility }}</p>
        
        <div class="flex items-center justify-between mt-4">
          <span class="text-xl font-bold text-gray-900">${{ part.price.toFixed(2) }} <span class="text-xs font-normal text-gray-500">MXN</span></span>
          <a href="#" class="text-blue-600 hover:text-blue-800 text-sm font-semibold">Ver Detalles</a>
        </div>
      </div>
      
    </div>

  </div>
</div>
